remote_theme: just-the-docs/just-the-docs@v0.8.2
title: Crypto Assets Handbook
description: A technical reference handbook on crypto assets, blockchains, and decentralized finance for developers and engineers.
url: "https://maximokopny.github.io"
baseurl: "/CryptoAssetsHandbook"
permalink: pretty
color_scheme: light
nav_sort: case_insensitive
back_to_top: true
last_edit_timestamp: true

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

just_the_docs:
  navigation_depth: 4

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links